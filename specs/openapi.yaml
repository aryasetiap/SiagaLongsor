openapi: 3.1.0
info:
  title: SiagaLongsor API
  version: 0.6.0
  description: >-
    API contract for SiagaLongsor. The final product contract covers authentication, health,
    telemetry ingestion, single-device overview/diagnostics, risk profile, and risk-transition
    audit. Site, MonitoringPoint, Device, alert, and other provisioning/support contracts remain
    available where required by the retained backend path; obsolete dashboard, map/SOP, and report
    product APIs have been removed from the runtime contract.
servers:
  - url: /api/v1
paths:
  /overview:
    get:
      tags: [SingleDevice]
      summary: Read the single-device monitoring overview
      security: [{ bearerAuth: [] }]
      x-required-roles: [PROJECT_OWNER]
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Authoritative single-device overview
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SingleDeviceOverviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /device:
    get:
      tags: [SingleDevice]
      summary: Read single-device connectivity and sensor diagnostics
      security: [{ bearerAuth: [] }]
      x-required-roles: [PROJECT_OWNER]
      responses:
        '200':
          description: Single-device diagnostics
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SingleDeviceDiagnosticsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /risk-profile:
    get:
      tags: [SingleDevice]
      summary: Read the active simplified single-device risk profile
      security: [{ bearerAuth: [] }]
      x-required-roles: [PROJECT_OWNER]
      responses:
        '200':
          description: Active simplified risk profile
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SingleDeviceRiskProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

    put:
      tags: [SingleDevice]
      summary: Create and activate the next simplified single-device risk-profile version
      security: [{ bearerAuth: [] }]
      x-required-roles: [PROJECT_OWNER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SingleDeviceRiskProfileUpdateRequest' }
      responses:
        '200':
          description: Risk profile update result
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SingleDeviceRiskProfileMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /audit-log:
    get:
      tags: [SingleDevice]
      summary: List authoritative risk-status transitions
      security: [{ bearerAuth: [] }]
      x-required-roles: [PROJECT_OWNER]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated authoritative risk transitions
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SingleDeviceAuditLogResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /health:
    get:
      tags: [Operations]
      summary: Check PostgreSQL and Redis connectivity
      responses:
        '200':
          description: Dependencies are healthy
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: At least one dependency is unavailable
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Access token returned; rotating refresh token set as an httpOnly cookie
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a refresh token and issue a new access token
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
      responses:
        '200':
          description: Token pair rotated
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the server-side session family and clear the refresh cookie
      security:
        - refreshCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
      responses:
        '204':
          description: Logout completed idempotently
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user and current organization memberships
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current principal
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPrincipal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sites:
    get:
      operationId: listSites
      tags: [Sites]
      summary: List sites in the active organization
      description: >-
        Read-only lookup for selecting a Site in MonitoringPoint and Device workflows. Available to
        PROJECT_OWNER and SCHOOL_ADMIN. Site management remains outside Phase 02. The opaque cursor
        is bound to the active organization, search value, sort, last sort value, and stable id
        tie-breaker. An invalid or mismatched cursor returns 400 INVALID_CURSOR; an unavailable
        active organization membership returns 403 ORGANIZATION_ACCESS_DENIED.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER, SCHOOL_ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SiteSort'
        - name: search
          in: query
          description: Lookup against Site name and address.
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Site lookup page limited to the active organization
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteListResponse' }
              examples:
                page:
                  externalValue: ./examples/phase-02/site-list.response.json
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /monitoring-points:
    get:
      operationId: listMonitoringPoints
      tags: [Monitoring]
      summary: List monitoring points in the active organization
      description: Available to PROJECT_OWNER and SCHOOL_ADMIN.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER, SCHOOL_ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/MonitoringPointSort'
        - name: siteId
          in: query
          schema: { type: string, minLength: 1 }
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Monitoring point page
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringPointListResponse' }
              examples:
                page:
                  externalValue: ./examples/phase-02/monitoring-point-list.response.json
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createMonitoringPoint
      tags: [Monitoring]
      summary: Create a monitoring point
      description: PROJECT_OWNER only. A new monitoring point is active by default.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMonitoringPointRequest' }
            examples:
              create:
                externalValue: ./examples/phase-02/monitoring-point-create.request.json
      responses:
        '201':
          description: Monitoring point created
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringPointResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /monitoring-points/{monitoringPointId}:
    get:
      operationId: getMonitoringPoint
      tags: [Monitoring]
      summary: Get a monitoring point
      description: >-
        Available to PROJECT_OWNER and SCHOOL_ADMIN. A resource outside the active organization is
        reported as not found.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER, SCHOOL_ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/MonitoringPointId'
      responses:
        '200':
          description: Monitoring point
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringPointResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateMonitoringPoint
      tags: [Monitoring]
      summary: Update a monitoring point
      description: >-
        PROJECT_OWNER only. siteId and organizationId are immutable. Deactivation is rejected while
        an enabled device remains assigned.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/MonitoringPointId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMonitoringPointRequest' }
      responses:
        '200':
          description: Monitoring point updated
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringPointResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /devices:
    get:
      operationId: listDevices
      tags: [Devices]
      summary: List devices in the active organization
      description: Available to PROJECT_OWNER and SCHOOL_ADMIN. Credentials are never returned.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER, SCHOOL_ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/DeviceSort'
        - name: siteId
          in: query
          schema: { type: string, minLength: 1 }
        - name: monitoringPointId
          in: query
          schema: { type: string, minLength: 1 }
        - name: lifecycleStatus
          in: query
          schema: { $ref: '#/components/schemas/DeviceLifecycleStatus' }
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Device page
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: registerDevice
      tags: [Devices]
      summary: Register a device and issue its first credential
      description: >-
        PROJECT_OWNER only. The raw secret is returned once and must not be persisted by the
        frontend.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceRequest' }
            examples:
              register:
                externalValue: ./examples/phase-02/device-register.request.json
      responses:
        '201':
          description: Device registered and credential issued for one-time display
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCredentialResponse' }
              examples:
                registered:
                  externalValue: ./examples/phase-02/device-register.response.json
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /devices/{deviceId}:
    get:
      operationId: getDevice
      tags: [Devices]
      summary: Get a device
      description: >-
        Available to PROJECT_OWNER and SCHOOL_ADMIN. A resource outside the active organization is
        reported as not found. Credentials are never returned.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER, SCHOOL_ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateDevice
      tags: [Devices]
      summary: Update device metadata or assignment
      description: PROJECT_OWNER only. hardwareId and lifecycle fields are immutable.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDeviceRequest' }
      responses:
        '200':
          description: Device updated
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /devices/{deviceId}/rotate-credential:
    post:
      operationId: rotateDeviceCredential
      tags: [Devices]
      summary: Rotate a device credential
      description: >-
        PROJECT_OWNER only. The previous secret becomes invalid immediately after commit, and the
        new raw secret is returned once.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Credential rotated and issued for one-time display
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCredentialResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /devices/{deviceId}/disable:
    post:
      operationId: disableDevice
      tags: [Devices]
      summary: Disable a device
      description: >-
        PROJECT_OWNER only. Disabling is idempotent, blocks telemetry immediately, and has no
        corresponding enable endpoint in Phase 02.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Current disabled device state
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /iot/telemetry:
    post:
      operationId: ingestTelemetry
      tags: [IoT]
      summary: Ingest device telemetry
      description: >-
        Device identity and organization are resolved from the custom Authorization credential.
        Idempotency-Key must exactly equal body messageId. Raw payload storage must exclude the
        Authorization header and credential.
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./telemetry-payload.schema.json
            examples:
              telemetry:
                externalValue: ./examples/phase-02/telemetry.request.json
      responses:
        '201':
          description: New append-only telemetry accepted
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryAccepted' }
              examples:
                accepted:
                  externalValue: ./examples/phase-02/telemetry-accepted.response.json
        '200':
          description: >-
            Exact duplicate already accepted. telemetryId and receivedAt are those of the original
            stored telemetry.
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryAccepted' }
              examples:
                duplicate:
                  externalValue: ./examples/phase-02/telemetry-duplicate.response.json
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /sites/{siteId}/risk-profile:
    get:
      operationId: getActiveRiskProfile
      tags: [Risk]
      summary: Get the active immutable risk profile version for a Site
      description: >-
        Returns the single active profile version for a Site in the active organization. Historical
        versions are immutable and are not exposed for mutation. A Site outside the organization is
        reported as 404 SITE_NOT_FOUND.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER, SCHOOL_ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Active Site risk profile
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskProfileResponse' }
              examples:
                active:
                  externalValue: ./examples/phase-03/active-risk-profile.response.json
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: replaceActiveRiskProfile
      tags: [Risk]
      summary: Create and activate an immutable Site risk profile version
      description: >-
        PROJECT_OWNER only. A configuration different from the active profile creates the next
        immutable version and atomically makes it active. A canonically identical request is a
        no-op: changed is false and the current profile is returned without a new version. Existing
        profiles and RiskAssessments are never rewritten. The provisional thresholds require expert
        and field-data calibration before being treated as final disaster thresholds.
      security:
        - bearerAuth: []
      x-required-roles: [PROJECT_OWNER]
      x-versioning-semantics: immutable-new-version-or-no-op
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRiskProfileRequest' }
            examples:
              provisional:
                externalValue: ./examples/phase-03/risk-profile-update.request.json
      responses:
        '200':
          description: Active profile returned; changed identifies new-version versus no-op
          headers:
            x-request-id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskProfileMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: siagalongsor_refresh
    deviceAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Custom device credential syntax: `Device <hardwareId>.<secret>`. hardwareId is public; the
        secret is opaque and must never be logged or persisted in raw telemetry.
  headers:
    XRequestId:
      description: Opaque request correlation identifier.
      schema: { type: string, minLength: 1 }
  parameters:
    BrowserOrigin:
      name: Origin
      in: header
      required: false
      description: >-
        Browser requests must match WEB_URL. Absence is allowed for development CLI and
        server-to-server clients.
      schema:
        type: string
        format: uri
    OrganizationId:
      name: X-Organization-Id
      in: header
      required: true
      description: >-
        Active organization context for organization-scoped user endpoints. Runtime CORS must
        allow this header. Missing header returns ORGANIZATION_CONTEXT_REQUIRED; inactive or absent
        membership returns ORGANIZATION_ACCESS_DENIED.
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor bound to organization, filters, sort, last sort value, and stable id
        tie-breaker. Clients must not parse it.
      schema: { type: string, minLength: 1 }
    SensorSeriesCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque signed cursor bound to organization, MonitoringPoint, normalized range, includeLate,
        fixed ordering, boundary recordedAt, and stable telemetryId. Invalid, expired, or
        context-mismatched values return INVALID_CURSOR. Clients must not parse it.
      schema: { type: string, minLength: 1 }
    SensorSeriesLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500
    SiteSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: name:asc
        enum: [name:asc, name:desc, createdAt:desc]
    MonitoringPointSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: createdAt:desc
        enum: [createdAt:desc, createdAt:asc, updatedAt:desc, name:asc, name:desc]
    DeviceSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: createdAt:desc
        enum:
          [
            createdAt:desc,
            createdAt:asc,
            updatedAt:desc,
            displayName:asc,
            displayName:desc,
            lastSeenAt:desc,
          ]
    MonitoringOverviewSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: name:asc
        enum: [name:asc, name:desc, risk:desc, connectivity:desc, lastTelemetryAt:desc]
    AlertSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: lastObservedAt:desc
        enum: [lastObservedAt:desc, createdAt:desc, severity:desc]
    SiteId:
      name: siteId
      in: path
      required: true
      description: Opaque Site resource identifier.
      schema: { type: string, minLength: 1 }
    MonitoringPointId:
      name: monitoringPointId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: Opaque API resource id, not hardwareId.
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Must exactly equal body messageId.
      schema: { type: string, minLength: 8, maxLength: 64 }
    AlertActionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID v4 that must exactly equal body actionId. It is bound to the alert,
        organization, action kind and canonical payload; requestId is never an idempotency key.
      schema:
        {
          type: string,
          format: uuid,
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$',
        }
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Observability hint only; the stream does not guarantee replay.
      schema: { type: string, minLength: 1, maxLength: 200 }
    AlertId:
      name: alertId
      in: path
      required: true
      description: Opaque Alert resource identifier.
      schema: { type: string, minLength: 1 }
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Opaque SOP document version identifier.
      schema: { type: string, minLength: 1 }
    ReportJobId:
      name: reportJobId
      in: path
      required: true
      description: Opaque report job identifier.
      schema: { type: string, minLength: 1 }
  responses:
    BadRequest:
      description: Invalid request, validation failure, missing organization context, or invalid cursor
      headers:
        x-request-id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            validation:
              externalValue: ./examples/phase-02/error-validation.response.json
    Unauthorized:
      description: User access token or device credential is missing or invalid
      headers:
        x-request-id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Organization, role, Origin, or disabled-device policy denied the request
      headers:
        x-request-id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found, including a resource outside the active organization
      headers:
        x-request-id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource assignment, idempotency, hardwareId, or boot-scoped sequence conflict
      headers:
        x-request-id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: Request body or uploaded file exceeds the configured size limit
      headers:
        x-request-id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Request Content-Type is not accepted for this operation
      headers:
        x-request-id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Request rate limit exceeded
      headers:
        x-request-id: { $ref: '#/components/headers/XRequestId' }
        Retry-After:
          description: Seconds until the caller should retry.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Safe internal error response without stack trace
      headers:
        x-request-id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    SingleDeviceSensorReading:
      type: [number, 'null']

    SingleDeviceSensorReadings:
      type: object
      additionalProperties: false
      required: [tiltMagnitudeDeg, soilMoisturePct, rainfallMmHour]
      properties:
        tiltMagnitudeDeg: { $ref: '#/components/schemas/SingleDeviceSensorReading' }
        soilMoisturePct: { $ref: '#/components/schemas/SingleDeviceSensorReading' }
        rainfallMmHour: { $ref: '#/components/schemas/SingleDeviceSensorReading' }

    SingleDeviceSeriesPoint:
      type: object
      additionalProperties: false
      required: [timestamp, value]
      properties:
        timestamp: { type: string, format: date-time }
        value: { type: [number, 'null'] }

    SingleDeviceSeries:
      type: object
      additionalProperties: false
      required: [tiltMagnitudeDeg, soilMoisturePct, rainfallMmHour]
      properties:
        tiltMagnitudeDeg:
          type: array
          items: { $ref: '#/components/schemas/SingleDeviceSeriesPoint' }
        soilMoisturePct:
          type: array
          items: { $ref: '#/components/schemas/SingleDeviceSeriesPoint' }
        rainfallMmHour:
          type: array
          items: { $ref: '#/components/schemas/SingleDeviceSeriesPoint' }

    SingleDeviceOverviewRisk:
      type: object
      additionalProperties: false
      required: [status, reasons, observedAt, freshness]
      properties:
        status: { $ref: '#/components/schemas/RiskLevel' }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/RiskReason' }
        observedAt: { type: [string, 'null'], format: date-time }
        freshness:
          type: string
          enum: [ONLINE, DELAYED, OFFLINE, UNKNOWN, UNAVAILABLE]

    SingleDeviceOverviewRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    SingleDeviceOverviewData:
      type: object
      additionalProperties: false
      required: [generatedAt, configured, risk, readings, series, range]
      properties:
        generatedAt: { type: string, format: date-time }
        configured: { type: boolean }
        risk: { $ref: '#/components/schemas/SingleDeviceOverviewRisk' }
        readings: { $ref: '#/components/schemas/SingleDeviceSensorReadings' }
        series: { $ref: '#/components/schemas/SingleDeviceSeries' }
        range: { $ref: '#/components/schemas/SingleDeviceOverviewRange' }

    SingleDeviceOverviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SingleDeviceOverviewData' }

    SingleDeviceSensorHealth:
      type: string
      enum: [READABLE, UNREADABLE, UNKNOWN]

    SingleDeviceSensorHealthSet:
      type: object
      additionalProperties: false
      required: [tilt, soilMoisture, rainfall]
      properties:
        tilt: { $ref: '#/components/schemas/SingleDeviceSensorHealth' }
        soilMoisture: { $ref: '#/components/schemas/SingleDeviceSensorHealth' }
        rainfall: { $ref: '#/components/schemas/SingleDeviceSensorHealth' }

    SingleDeviceNetwork:
      type: [object, 'null']
      additionalProperties: false
      required: [type, signalRssi]
      properties:
        type:
          type: string
          enum: [WIFI, CELLULAR, UNKNOWN]
        signalRssi: { type: [number, 'null'] }

    SingleDeviceDiagnosticsData:
      type: object
      additionalProperties: false
      required:
        [
          configured,
          hardwareId,
          displayName,
          firmwareVersion,
          connectivity,
          lastSeenAt,
          lastTelemetryAt,
          network,
          batteryVoltage,
          sensors,
        ]
      properties:
        configured: { type: boolean }
        hardwareId: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
        firmwareVersion: { type: [string, 'null'] }
        connectivity: { $ref: '#/components/schemas/ConnectivityStatus' }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        lastTelemetryAt: { type: [string, 'null'], format: date-time }
        network: { $ref: '#/components/schemas/SingleDeviceNetwork' }
        batteryVoltage: { type: [number, 'null'] }
        sensors: { $ref: '#/components/schemas/SingleDeviceSensorHealthSet' }

    SingleDeviceDiagnosticsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SingleDeviceDiagnosticsData' }

    SingleDeviceThreshold:
      type: object
      additionalProperties: false
      required: [watch, danger]
      description: WATCH must be lower than DANGER and both values must remain inside the stored technical range.
      properties:
        watch: { type: number, minimum: 0 }
        danger: { type: number, minimum: 0 }

    SingleDeviceRiskProfile:
      type: object
      additionalProperties: false
      required:
        [
          version,
          calibrationStatus,
          activatedAt,
          notes,
          tiltMagnitudeDeg,
          soilMoisturePct,
          rainfallMmHour,
        ]
      properties:
        version: { type: integer, minimum: 1 }
        calibrationStatus: { $ref: '#/components/schemas/CalibrationStatus' }
        activatedAt: { type: string, format: date-time }
        notes: { type: [string, 'null'], maxLength: 2000 }
        tiltMagnitudeDeg: { $ref: '#/components/schemas/SingleDeviceThreshold' }
        soilMoisturePct: { $ref: '#/components/schemas/SingleDeviceThreshold' }
        rainfallMmHour: { $ref: '#/components/schemas/SingleDeviceThreshold' }

    SingleDeviceRiskProfileResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SingleDeviceRiskProfile' }

    SingleDeviceRiskProfileUpdateRequest:
      type: object
      additionalProperties: false
      required: [tiltMagnitudeDeg, soilMoisturePct, rainfallMmHour]
      properties:
        tiltMagnitudeDeg: { $ref: '#/components/schemas/SingleDeviceThreshold' }
        soilMoisturePct: { $ref: '#/components/schemas/SingleDeviceThreshold' }
        rainfallMmHour: { $ref: '#/components/schemas/SingleDeviceThreshold' }
        calibrationStatus: { $ref: '#/components/schemas/CalibrationStatus' }
        notes: { type: [string, 'null'], maxLength: 2000 }

    SingleDeviceRiskProfileMutationData:
      type: object
      additionalProperties: false
      required: [profile, changed]
      properties:
        profile: { $ref: '#/components/schemas/SingleDeviceRiskProfile' }
        changed: { type: boolean }

    SingleDeviceRiskProfileMutationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SingleDeviceRiskProfileMutationData' }

    SingleDeviceRiskAuditEntry:
      type: object
      additionalProperties: false
      required:
        [
          id,
          previousStatus,
          currentStatus,
          reasons,
          sensorSnapshot,
          riskProfile,
          telemetryId,
          occurredAt,
        ]
      properties:
        id: { type: string, minLength: 1 }
        previousStatus: { $ref: '#/components/schemas/RiskLevel' }
        currentStatus: { $ref: '#/components/schemas/RiskLevel' }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/RiskReason' }
        sensorSnapshot: { $ref: '#/components/schemas/SingleDeviceSensorReadings' }
        riskProfile:
          type: object
          additionalProperties: false
          required: [id, version]
          properties:
            id: { type: [string, 'null'] }
            version: { type: [integer, 'null'], minimum: 1 }
        telemetryId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }

    SingleDeviceAuditLogResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SingleDeviceRiskAuditEntry' }
        page: { $ref: '#/components/schemas/PageInfo' }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, database, redis]
      properties:
        status: { type: string, const: ok }
        database: { type: string, const: up }
        redis: { type: string, const: up }
    Role:
      type: string
      enum: [PROJECT_OWNER, SCHOOL_ADMIN]
    Membership:
      type: object
      additionalProperties: false
      required: [organizationId, organizationName, role]
      properties:
        organizationId: { type: string }
        organizationName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    UserPrincipal:
      type: object
      additionalProperties: false
      required: [id, email, name, memberships]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, minimum: 60 }
        user: { $ref: '#/components/schemas/UserPrincipal' }
    ValidationDetail:
      type: object
      additionalProperties: false
      required: [field, messages]
      properties:
        field: { type: string, minLength: 1 }
        messages:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
    ErrorCode:
      type: string
      enum:
        - ACCESS_TOKEN_INVALID
        - ACCESS_TOKEN_REQUIRED
        - AUTHENTICATION_REQUIRED
        - ALERT_NOT_FOUND
        - ALERT_STATE_CONFLICT
        - BAD_REQUEST
        - CONFLICT
        - DEPENDENCY_UNAVAILABLE
        - DEVICE_CREDENTIAL_INVALID
        - DEVICE_DISABLED
        - DEVICE_NOT_FOUND
        - FORBIDDEN
        - HARDWARE_ID_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - IDEMPOTENCY_KEY_MISMATCH
        - INTERNAL_ERROR
        - INVALID_CREDENTIALS
        - INVALID_CURSOR
        - MONITORING_POINT_ACTIVE_DEVICE_CONFLICT
        - MONITORING_POINT_NOT_FOUND
        - ORGANIZATION_ACCESS_DENIED
        - ORGANIZATION_CONTEXT_REQUIRED
        - ORIGIN_NOT_ALLOWED
        - PAYLOAD_TOO_LARGE
        - RATE_LIMITED
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REQUIRED
        - RISK_PROFILE_NOT_FOUND
        - ROLE_ACCESS_DENIED
        - SEQUENCE_CONFLICT
        - SESSION_INVALID
        - SITE_NOT_FOUND
        - UNAUTHORIZED
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_ERROR
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, requestId, timestamp]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, minLength: 1 }
            details:
              type: array
              items: { $ref: '#/components/schemas/ValidationDetail' }
        requestId: { type: string, minLength: 1 }
        timestamp: { type: string, format: date-time }
    PageInfo:
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    SiteLookup:
      type: object
      additionalProperties: false
      required: [id, name, address, timezone]
      description: Read-only Site projection for MonitoringPoint and Device selection.
      properties:
        id:
          type: string
          minLength: 1
          description: Opaque Site resource identifier.
        name: { type: string, minLength: 1 }
        address: { type: [string, 'null'] }
        timezone:
          type: string
          minLength: 1
          description: IANA timezone identifier.
          examples: [Asia/Jakarta]
    SiteListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SiteLookup' }
        page: { $ref: '#/components/schemas/PageInfo' }
    DeviceLifecycleStatus:
      type: string
      enum: [ENABLED, DISABLED]
    NetworkType:
      type: string
      enum: [WIFI, CELLULAR, UNKNOWN]
    DeviceSummary:
      type: object
      additionalProperties: false
      required: [id, hardwareId, displayName, lifecycleStatus, lastSeenAt]
      properties:
        id: { type: string, minLength: 1 }
        hardwareId:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{2,63}$
        displayName: { type: string, minLength: 1, maxLength: 120 }
        lifecycleStatus: { $ref: '#/components/schemas/DeviceLifecycleStatus' }
        lastSeenAt: { type: [string, 'null'], format: date-time }
    MonitoringPoint:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          siteId,
          name,
          description,
          locationDescription,
          isActive,
          currentDevice,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, minLength: 1 }
        organizationId: { type: string, minLength: 1 }
        siteId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        locationDescription: { type: [string, 'null'], maxLength: 500 }
        isActive: { type: boolean }
        currentDevice:
          oneOf:
            - $ref: '#/components/schemas/DeviceSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateMonitoringPointRequest:
      type: object
      additionalProperties: false
      required: [siteId, name]
      properties:
        siteId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        locationDescription: { type: [string, 'null'], maxLength: 500 }
    UpdateMonitoringPointRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        locationDescription: { type: [string, 'null'], maxLength: 500 }
        isActive: { type: boolean }
    MonitoringPointResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/MonitoringPoint' }
    MonitoringPointListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MonitoringPoint' }
        page: { $ref: '#/components/schemas/PageInfo' }
    LastNetwork:
      type: object
      additionalProperties: false
      required: [type, signalRssi]
      properties:
        type: { $ref: '#/components/schemas/NetworkType' }
        signalRssi: { type: [number, 'null'], minimum: -150, maximum: 0 }
    Device:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          siteId,
          monitoringPointId,
          hardwareId,
          displayName,
          lifecycleStatus,
          firmwareVersion,
          lastSeenAt,
          lastTelemetryAt,
          lastNetwork,
          disabledAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          minLength: 1
          description: Opaque API resource id.
        organizationId: { type: string, minLength: 1 }
        siteId: { type: string, minLength: 1 }
        monitoringPointId: { type: string, minLength: 1 }
        hardwareId:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{2,63}$
          description: Public globally unique immutable device identifier.
        displayName: { type: string, minLength: 1, maxLength: 120 }
        lifecycleStatus: { $ref: '#/components/schemas/DeviceLifecycleStatus' }
        firmwareVersion: { type: [string, 'null'], minLength: 1, maxLength: 32 }
        lastSeenAt:
          type: [string, 'null']
          format: date-time
          description: Server receipt time of the latest newly accepted valid telemetry.
        lastTelemetryAt:
          type: [string, 'null']
          format: date-time
          description: Latest device timestamp selected as current; late telemetry never moves it backward.
        lastNetwork:
          oneOf:
            - $ref: '#/components/schemas/LastNetwork'
            - type: 'null'
        disabledAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [hardwareId, displayName, monitoringPointId]
      properties:
        hardwareId:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{2,63}$
        displayName: { type: string, minLength: 1, maxLength: 120 }
        monitoringPointId: { type: string, minLength: 1 }
    UpdateDeviceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        monitoringPointId: { type: string, minLength: 1 }
    IssuedDeviceCredential:
      type: object
      additionalProperties: false
      required: [scheme, hardwareId, secret, issuedAt, displayOnce]
      description: >-
        Response-only one-time credential. It is never returned by Device GET or list endpoints,
        persisted by the frontend, logged, or included in URLs.
      properties:
        scheme: { type: string, const: Device }
        hardwareId:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{2,63}$
        secret:
          type: string
          minLength: 32
          description: Opaque raw secret returned only at register or rotation.
        issuedAt: { type: string, format: date-time }
        displayOnce: { type: boolean, const: true }
    DeviceResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Device' }
    DeviceListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Device' }
        page: { $ref: '#/components/schemas/PageInfo' }
    DeviceCredentialData:
      type: object
      additionalProperties: false
      required: [device, credential]
      properties:
        device: { $ref: '#/components/schemas/Device' }
        credential: { $ref: '#/components/schemas/IssuedDeviceCredential' }
    DeviceCredentialResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/DeviceCredentialData' }
    TelemetryAccepted:
      type: object
      additionalProperties: false
      required: [accepted, duplicate, telemetryId, receivedAt]
      properties:
        accepted: { type: boolean, const: true }
        duplicate: { type: boolean }
        telemetryId: { type: string, minLength: 1 }
        receivedAt:
          type: string
          format: date-time
          description: Original server receipt timestamp for both new and duplicate acknowledgements.
    RiskLevel:
      type: string
      enum: [SAFE, WATCH, DANGER, UNKNOWN]
    ConnectivityStatus:
      type: string
      enum: [ONLINE, DELAYED, OFFLINE, UNKNOWN]
    CalibrationStatus:
      type: string
      enum: [PROVISIONAL, CALIBRATED]
    RiskReason:
      type: string
      enum:
        - SAFE_THRESHOLDS_MET
        - WATCH_THRESHOLDS_MET
        - DANGER_TILT
        - DANGER_RAIN_MOISTURE
        - REQUIRED_SENSOR_MISSING
        - REQUIRED_SENSOR_INVALID
        - DEVICE_DISABLED
        - TELEMETRY_DELAYED
        - DEVICE_OFFLINE
        - TIMESTAMP_UNTRUSTED
        - PROFILE_UNAVAILABLE
        - DEVICE_SERVER_MISMATCH
        - WATCH_HYSTERESIS_PENDING
        - DOWNGRADE_STABILITY_PENDING
        - DANGER_SOIL_MOISTURE
        - DANGER_RAINFALL
    SafeThresholds:
      type: object
      additionalProperties: false
      required: [tiltMagnitudeDegLt, soilMoisturePctLt, rainfallMmHourLt]
      properties:
        tiltMagnitudeDegLt: { type: number, exclusiveMinimum: 0, maximum: 180 }
        soilMoisturePctLt: { type: number, exclusiveMinimum: 0, maximum: 100 }
        rainfallMmHourLt: { type: number, exclusiveMinimum: 0 }
    DangerThresholds:
      type: object
      additionalProperties: false
      required: [tiltMagnitudeDegGt, rainfallMmHourGt, soilMoisturePctGt]
      properties:
        tiltMagnitudeDegGt: { type: number, minimum: 0, maximum: 180 }
        rainfallMmHourGt: { type: number, minimum: 0 }
        soilMoisturePctGt: { type: number, minimum: 0, maximum: 100 }
    RiskThresholds:
      type: object
      additionalProperties: false
      required: [safe, danger]
      properties:
        safe: { $ref: '#/components/schemas/SafeThresholds' }
        danger: { $ref: '#/components/schemas/DangerThresholds' }
    TechnicalRange:
      type: object
      additionalProperties: false
      required: [minimum, maximum]
      properties:
        minimum: { type: number }
        maximum:
          type: [number, 'null']
          description: Null means no calibrated static upper bound is available.
    TechnicalSensorRanges:
      type: object
      additionalProperties: false
      required:
        [
          tiltXDeg,
          tiltYDeg,
          tiltMagnitudeDeg,
          soilMoisturePct,
          rainfallMmHour,
          batteryVoltage,
          signalRssi,
        ]
      properties:
        tiltXDeg: { $ref: '#/components/schemas/TechnicalRange' }
        tiltYDeg: { $ref: '#/components/schemas/TechnicalRange' }
        tiltMagnitudeDeg: { $ref: '#/components/schemas/TechnicalRange' }
        soilMoisturePct: { $ref: '#/components/schemas/TechnicalRange' }
        rainfallMmHour: { $ref: '#/components/schemas/TechnicalRange' }
        batteryVoltage: { $ref: '#/components/schemas/TechnicalRange' }
        signalRssi: { $ref: '#/components/schemas/TechnicalRange' }
    RiskFreshness:
      type: object
      additionalProperties: false
      required: [onlineWithinMinutes, offlineAfterMinutes]
      properties:
        onlineWithinMinutes: { type: integer, minimum: 1 }
        offlineAfterMinutes: { type: integer, minimum: 2 }
    RiskHysteresis:
      type: object
      additionalProperties: false
      required:
        [
          watchConsecutiveSamples,
          dangerConsecutiveSamples,
          downgradeStableMinutes,
          mismatchConsecutiveSamples,
        ]
      properties:
        watchConsecutiveSamples: { type: integer, minimum: 1 }
        dangerConsecutiveSamples: { type: integer, minimum: 1 }
        downgradeStableMinutes: { type: integer, minimum: 0 }
        mismatchConsecutiveSamples: { type: integer, minimum: 1 }
    RiskProfile:
      type: object
      additionalProperties: false
      required:
        [
          id,
          siteId,
          version,
          calibrationStatus,
          thresholds,
          technicalRanges,
          freshness,
          hysteresis,
          notes,
          createdAt,
          activatedAt,
        ]
      description: >-
        Immutable Site-scoped configuration version. Only one version is active per Site; changing
        configuration creates and activates a new version.
      properties:
        id: { type: string, minLength: 1 }
        siteId: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
        calibrationStatus: { $ref: '#/components/schemas/CalibrationStatus' }
        thresholds: { $ref: '#/components/schemas/RiskThresholds' }
        technicalRanges: { $ref: '#/components/schemas/TechnicalSensorRanges' }
        freshness: { $ref: '#/components/schemas/RiskFreshness' }
        hysteresis: { $ref: '#/components/schemas/RiskHysteresis' }
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: string, format: date-time }
    UpdateRiskProfileRequest:
      type: object
      additionalProperties: false
      required: [calibrationStatus, thresholds, technicalRanges, freshness, hysteresis, notes]
      properties:
        calibrationStatus: { $ref: '#/components/schemas/CalibrationStatus' }
        thresholds: { $ref: '#/components/schemas/RiskThresholds' }
        technicalRanges: { $ref: '#/components/schemas/TechnicalSensorRanges' }
        freshness: { $ref: '#/components/schemas/RiskFreshness' }
        hysteresis: { $ref: '#/components/schemas/RiskHysteresis' }
        notes: { type: [string, 'null'], maxLength: 2000 }
    RiskProfileResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RiskProfile' }
    RiskProfileMutationData:
      type: object
      additionalProperties: false
      required: [profile, changed]
      properties:
        profile: { $ref: '#/components/schemas/RiskProfile' }
        changed:
          type: boolean
          description: False only when the canonical request equals the active configuration.
    RiskProfileMutationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RiskProfileMutationData' }
    RiskAssessment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          telemetryId,
          monitoringPointId,
          deviceId,
          serverRisk,
          reasons,
          firmwareRisk,
          firmwareSirenActive,
          affectsCurrentState,
          evaluatedAt,
          profileId,
          profileVersion,
        ]
      properties:
        id: { type: string, minLength: 1 }
        telemetryId: { type: string, minLength: 1 }
        monitoringPointId: { type: string, minLength: 1 }
        deviceId: { type: string, minLength: 1 }
        serverRisk: { $ref: '#/components/schemas/RiskLevel' }
        reasons:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/RiskReason' }
        firmwareRisk: { $ref: '#/components/schemas/RiskLevel' }
        firmwareSirenActive: { type: boolean }
        affectsCurrentState:
          type: boolean
          description: False for accepted late telemetry; it cannot alter hysteresis or alerts.
        evaluatedAt: { type: string, format: date-time }
        profileId: { type: string, minLength: 1 }
        profileVersion: { type: integer, minimum: 1 }
    RiskAssessmentListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RiskAssessment' }
        page: { $ref: '#/components/schemas/PageInfo' }
    SiteIdentity:
      type: object
      additionalProperties: false
      required: [id, name, timezone]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        timezone: { type: string, minLength: 1 }
    MonitoringPointIdentity:
      type: object
      additionalProperties: false
      required: [id, name, locationDescription, isActive]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        locationDescription: { type: [string, 'null'], maxLength: 500 }
        isActive: { type: boolean }
    CurrentDeviceSummary:
      type: object
      additionalProperties: false
      required: [id, hardwareId, displayName, lifecycleStatus]
      properties:
        id: { type: string, minLength: 1 }
        hardwareId:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{2,63}$
        displayName: { type: string, minLength: 1 }
        lifecycleStatus: { $ref: '#/components/schemas/DeviceLifecycleStatus' }
    LatestTelemetrySensorSummary:
      type: object
      additionalProperties: false
      required:
        [
          telemetryId,
          deviceTimestamp,
          serverReceivedAt,
          tiltMagnitudeDeg,
          soilMoisturePct,
          rainfallMmHour,
          batteryVoltage,
        ]
      properties:
        telemetryId: { type: string, minLength: 1 }
        deviceTimestamp: { type: string, format: date-time }
        serverReceivedAt: { type: string, format: date-time }
        tiltMagnitudeDeg: { type: number }
        soilMoisturePct: { type: number }
        rainfallMmHour: { type: number }
        batteryVoltage: { type: number }
    AlertType:
      type: string
      enum: [RISK_WATCH, RISK_DANGER, DEVICE_DELAYED, DEVICE_OFFLINE, DEVICE_SERVER_MISMATCH]
    AlertSeverity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    AlertStatus:
      type: string
      enum: [ACTIVE, ACKNOWLEDGED, RESOLVED, FALSE_ALARM]
    ActiveAlertSummary:
      type: object
      additionalProperties: false
      required: [count, highestSeverity, types]
      properties:
        count: { type: integer, minimum: 0 }
        highestSeverity:
          oneOf:
            - $ref: '#/components/schemas/AlertSeverity'
            - type: 'null'
        types:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/AlertType' }
    CurrentMonitoringPointState:
      type: object
      additionalProperties: false
      required:
        [
          monitoringPointId,
          deviceId,
          serverRisk,
          connectivityStatus,
          reasons,
          latestTelemetryId,
          evaluatedAt,
          lastTelemetryAt,
          profileId,
          profileVersion,
          activeAlertSummary,
        ]
      description: >-
        Current read projection. It never replaces immutable RiskAssessment history and is not
        advanced by late or duplicate telemetry.
      properties:
        monitoringPointId: { type: string, minLength: 1 }
        deviceId: { type: [string, 'null'], minLength: 1 }
        serverRisk: { $ref: '#/components/schemas/RiskLevel' }
        connectivityStatus: { $ref: '#/components/schemas/ConnectivityStatus' }
        reasons:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/RiskReason' }
        latestTelemetryId: { type: [string, 'null'], minLength: 1 }
        evaluatedAt: { type: string, format: date-time }
        lastTelemetryAt: { type: [string, 'null'], format: date-time }
        profileId: { type: [string, 'null'], minLength: 1 }
        profileVersion: { type: [integer, 'null'], minimum: 1 }
        activeAlertSummary: { $ref: '#/components/schemas/ActiveAlertSummary' }
    MonitoringOverviewItem:
      type: object
      additionalProperties: false
      required: [monitoringPoint, site, device, latestTelemetry, currentState]
      properties:
        monitoringPoint: { $ref: '#/components/schemas/MonitoringPointIdentity' }
        site: { $ref: '#/components/schemas/SiteIdentity' }
        device:
          oneOf:
            - $ref: '#/components/schemas/CurrentDeviceSummary'
            - type: 'null'
        latestTelemetry:
          oneOf:
            - $ref: '#/components/schemas/LatestTelemetrySensorSummary'
            - type: 'null'
        currentState: { $ref: '#/components/schemas/CurrentMonitoringPointState' }
    MonitoringOverviewResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MonitoringOverviewItem' }
        page: { $ref: '#/components/schemas/PageInfo' }
    DashboardWindow:
      type: object
      additionalProperties: false
      required: [hours, from, to]
      description: >-
        Reporting context for new alerts. from is inclusive, to is exclusive, and to equals the
        enclosing summary generatedAt timestamp.
      properties:
        hours: { type: integer, minimum: 1, maximum: 168 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    MonitoringPointCounts:
      type: object
      additionalProperties: false
      required: [total, active, inactive]
      description: All MonitoringPoints in scope; active plus inactive must equal total.
      properties:
        total: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        inactive: { type: integer, minimum: 0 }
    RiskDistribution:
      type: object
      additionalProperties: false
      required: [safe, watch, danger, unknown]
      description: >-
        Current server risk for active MonitoringPoints only. Buckets sum to monitoringPoints.active.
        Active points without trusted current state and unavailable, delayed, offline, invalid, or
        profile-unavailable state belong to unknown and must never be counted as safe.
      properties:
        safe: { type: integer, minimum: 0 }
        watch: { type: integer, minimum: 0 }
        danger: { type: integer, minimum: 0 }
        unknown: { type: integer, minimum: 0 }
    DeviceCounts:
      type: object
      additionalProperties: false
      required: [total, enabled, disabled]
      description: >-
        Devices currently assigned to MonitoringPoints in scope. enabled plus disabled equals total.
      properties:
        total: { type: integer, minimum: 0 }
        enabled: { type: integer, minimum: 0 }
        disabled: { type: integer, minimum: 0 }
    ConnectivityDistribution:
      type: object
      additionalProperties: false
      required: [online, delayed, offline, unknown]
      description: >-
        Connectivity for ENABLED Devices only. Buckets sum to devices.enabled. Enabled Devices
        without trusted connectivity belong to unknown; DISABLED Devices must never be offline.
      properties:
        online: { type: integer, minimum: 0 }
        delayed: { type: integer, minimum: 0 }
        offline: { type: integer, minimum: 0 }
        unknown: { type: integer, minimum: 0 }
    DashboardAlertCounts:
      type: object
      additionalProperties: false
      required: [active, activeCritical, newInWindow]
      description: >-
        active counts unresolved Alerts. activeCritical is the unresolved CRITICAL subset and cannot
        exceed active. newInWindow counts Alerts by firstObservedAt in [from,to), not repeated
        observations or occurrenceCount.
      properties:
        active: { type: integer, minimum: 0 }
        activeCritical: { type: integer, minimum: 0 }
        newInWindow: { type: integer, minimum: 0 }
    DashboardSummary:
      type: object
      additionalProperties: false
      required:
        [
          generatedAt,
          window,
          monitoringPoints,
          riskDistribution,
          devices,
          connectivityDistribution,
          alerts,
        ]
      description: >-
        Authoritative complete-scope aggregate. It must not be derived from a cursor page and does
        not contain fabricated period deltas or historical current-state estimates.
      properties:
        generatedAt: { type: string, format: date-time }
        window: { $ref: '#/components/schemas/DashboardWindow' }
        monitoringPoints: { $ref: '#/components/schemas/MonitoringPointCounts' }
        riskDistribution: { $ref: '#/components/schemas/RiskDistribution' }
        devices: { $ref: '#/components/schemas/DeviceCounts' }
        connectivityDistribution: { $ref: '#/components/schemas/ConnectivityDistribution' }
        alerts: { $ref: '#/components/schemas/DashboardAlertCounts' }
    DashboardSummaryResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/DashboardSummary' }
    SensorSeriesPoint:
      type: object
      additionalProperties: false
      required:
        [
          telemetryId,
          deviceId,
          recordedAt,
          serverReceivedAt,
          isLate,
          tiltMagnitudeDeg,
          soilMoisturePct,
          rainfallMmHour,
          batteryVoltage,
        ]
      description: >-
        One validated stored telemetry point. recordedAt is the device timestamp. Values are never
        interpolated, smoothed, or fabricated; isLate identifies accepted historical telemetry.
      properties:
        telemetryId: { type: string, minLength: 1 }
        deviceId: { type: string, minLength: 1 }
        recordedAt: { type: string, format: date-time }
        serverReceivedAt: { type: string, format: date-time }
        isLate: { type: boolean }
        tiltMagnitudeDeg: { type: number }
        soilMoisturePct: { type: number }
        rainfallMmHour: { type: number }
        batteryVoltage:
          type: [number, 'null']
          description: Null remains null and must not be rendered as zero.
    SensorSeriesPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      description: >-
        Oldest-first stable page. The signed cursor prevents duplicate or skipped telemetry when
        recordedAt values are equal by using telemetryId as the tie-breaker.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SensorSeriesPoint' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    SensorSeriesResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SensorSeriesPage' }
    Alert:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          site,
          monitoringPoint,
          deviceId,
          type,
          severity,
          status,
          reasons,
          occurrenceCount,
          firstObservedAt,
          lastObservedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, minLength: 1 }
        organizationId: { type: string, minLength: 1 }
        site: { $ref: '#/components/schemas/SiteIdentity' }
        monitoringPoint: { $ref: '#/components/schemas/MonitoringPointIdentity' }
        deviceId: { type: [string, 'null'], minLength: 1 }
        type: { $ref: '#/components/schemas/AlertType' }
        severity: { $ref: '#/components/schemas/AlertSeverity' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        reasons:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/RiskReason' }
        occurrenceCount: { type: integer, minimum: 1 }
        firstObservedAt: { type: string, format: date-time }
        lastObservedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlertListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        page: { $ref: '#/components/schemas/PageInfo' }
    AlertResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Alert' }
    AlertActionId:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      description: Client-generated UUID v4 used for lifecycle action idempotency.
    AcknowledgeAlertRequest:
      type: object
      additionalProperties: false
      required: [actionId, note, fieldCondition, sopExecuted]
      properties:
        actionId: { $ref: '#/components/schemas/AlertActionId' }
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: Server trims leading and trailing whitespace before validation and storage.
        fieldCondition:
          type: string
          minLength: 1
          maxLength: 1000
          description: Server trims leading and trailing whitespace before validation and storage.
        sopExecuted: { type: boolean }
    ResolveAlertRequest:
      type: object
      additionalProperties: false
      required: [actionId, resolutionNote]
      properties:
        actionId: { $ref: '#/components/schemas/AlertActionId' }
        resolutionNote:
          type: string
          minLength: 1
          maxLength: 2000
          description: Server trims leading and trailing whitespace before validation and storage.
    FalseAlarmAlertRequest:
      type: object
      additionalProperties: false
      required: [actionId, reason]
      properties:
        actionId: { $ref: '#/components/schemas/AlertActionId' }
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Server trims leading and trailing whitespace before validation and storage.
    AlertLifecycleEventType:
      type: string
      enum:
        - CREATED
        - OBSERVED
        - CONNECTIVITY_TRANSITION
        - ALERT_ACKNOWLEDGED
        - ALERT_RESOLVED
        - ALERT_FALSE_ALARM
    AlertLifecycleActionType:
      type: string
      enum: [ALERT_ACKNOWLEDGED, ALERT_RESOLVED, ALERT_FALSE_ALARM]
    SafeActorSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
    AlertLifecycleActionSummary:
      type: object
      additionalProperties: false
      required: [actionId, eventId, eventType, previousStatus, nextStatus, actedAt, actor]
      properties:
        actionId: { $ref: '#/components/schemas/AlertActionId' }
        eventId: { type: string, minLength: 1 }
        eventType: { $ref: '#/components/schemas/AlertLifecycleActionType' }
        previousStatus: { $ref: '#/components/schemas/AlertStatus' }
        nextStatus: { $ref: '#/components/schemas/AlertStatus' }
        actedAt: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/SafeActorSummary' }
    AlertMutationResponse:
      type: object
      additionalProperties: false
      required: [data, action]
      properties:
        data: { $ref: '#/components/schemas/Alert' }
        action: { $ref: '#/components/schemas/AlertLifecycleActionSummary' }
    AlertEventMetadata:
      type: object
      additionalProperties: false
      description: Sanitized projection; never contains IP, user agent, credential, token or raw request.
      properties:
        actorId: { type: string, minLength: 1 }
        actionId: { $ref: '#/components/schemas/AlertActionId' }
        note: { type: string, minLength: 1, maxLength: 2000 }
        fieldCondition: { type: string, minLength: 1, maxLength: 1000 }
        sopExecuted: { type: boolean }
        resolutionNote: { type: string, minLength: 1, maxLength: 2000 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        previousStatus: { $ref: '#/components/schemas/AlertStatus' }
        nextStatus: { $ref: '#/components/schemas/AlertStatus' }
    AlertEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          eventType,
          observedAt,
          actedAt,
          createdAt,
          actor,
          metadata,
          riskAssessmentId,
          telemetryId,
        ]
      properties:
        id: { type: string, minLength: 1 }
        eventType: { $ref: '#/components/schemas/AlertLifecycleEventType' }
        observedAt: { type: [string, 'null'], format: date-time }
        actedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        actor:
          oneOf:
            - $ref: '#/components/schemas/SafeActorSummary'
            - type: 'null'
        metadata: { $ref: '#/components/schemas/AlertEventMetadata' }
        riskAssessmentId: { type: [string, 'null'], minLength: 1 }
        telemetryId: { type: [string, 'null'], minLength: 1 }
    AlertEventListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AlertEvent' }
        page: { $ref: '#/components/schemas/PageInfo' }
    AuditLogEntry:
      type: object
      additionalProperties: false
      required: [id, eventType, entityType, entityId, actor, requestId, metadata, createdAt]
      description: Safe public audit projection; transport and secret-bearing fields are excluded.
      properties:
        id: { type: string, minLength: 1 }
        eventType: { type: string, minLength: 1, maxLength: 100 }
        entityType: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        entityId: { type: [string, 'null'], minLength: 1 }
        actor:
          oneOf:
            - $ref: '#/components/schemas/SafeActorSummary'
            - type: 'null'
        requestId: { type: string, minLength: 1 }
        metadata: { $ref: '#/components/schemas/AlertEventMetadata' }
        createdAt: { type: string, format: date-time }
    AuditLogListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditLogEntry' }
        page: { $ref: '#/components/schemas/PageInfo' }
    RealtimeEventType:
      type: string
      enum:
        - ALERT_CREATED
        - ALERT_OBSERVED
        - ALERT_ACKNOWLEDGED
        - ALERT_RESOLVED
        - ALERT_FALSE_ALARM
        - MONITORING_POINT_STATE_CHANGED
    RealtimeEvent:
      type: object
      additionalProperties: false
      required: [eventId, eventType, occurredAt, siteId, monitoringPointId, alertId]
      description: >-
        Minimal invalidation notification. Consumers refetch REST resources and must not treat this
        envelope as authoritative domain state.
      properties:
        eventId: { type: string, minLength: 1 }
        eventType: { $ref: '#/components/schemas/RealtimeEventType' }
        occurredAt: { type: string, format: date-time }
        siteId: { type: [string, 'null'], minLength: 1 }
        monitoringPointId: { type: [string, 'null'], minLength: 1 }
        alertId: { type: [string, 'null'], minLength: 1 }
    GeoJsonPosition:
      type: array
      description: WGS84/EPSG:4326 position in [longitude, latitude] order; altitude is forbidden.
      minItems: 2
      maxItems: 2
      prefixItems:
        - { type: number, minimum: -180, maximum: 180 }
        - { type: number, minimum: -90, maximum: 90 }
      items: false
    MapCenter:
      type: object
      additionalProperties: false
      required: [position, zoom]
      properties:
        position: { $ref: '#/components/schemas/GeoJsonPosition' }
        zoom: { type: integer, minimum: 0, maximum: 22 }
    MonitoringPointMapLocation:
      type: object
      additionalProperties: false
      required: [monitoringPointId, position]
      properties:
        monitoringPointId: { type: string, minLength: 1 }
        position: { $ref: '#/components/schemas/GeoJsonPosition' }
    GeoJsonPolygon:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      description: >-
        Valid GeoJSON Polygon. Each linear ring has at least four positions and its first and last
        positions must be identical. Portable structural validation does not claim full GIS
        topology or self-intersection detection.
      properties:
        type: { type: string, const: Polygon }
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items: { $ref: '#/components/schemas/GeoJsonPosition' }
    GeoJsonLineString:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      description: Valid GeoJSON LineString with at least two distinct positions.
      properties:
        type: { type: string, const: LineString }
        coordinates:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/GeoJsonPosition' }
    RiskZoneFeature:
      type: object
      additionalProperties: false
      required: [featureId, name, description, geometry]
      description: Manually approved static reference zone; it is not a realtime prediction.
      properties:
        featureId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 1000 }
        geometry: { $ref: '#/components/schemas/GeoJsonPolygon' }
    EvacuationRouteFeature:
      type: object
      additionalProperties: false
      required: [featureId, name, description, destinationLabel, geometry]
      description: Manually approved static evacuation route; no automatic routing is implied.
      properties:
        featureId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 1000 }
        destinationLabel: { type: [string, 'null'], maxLength: 200 }
        geometry: { $ref: '#/components/schemas/GeoJsonLineString' }
    SiteMapConfigurationInput:
      type: object
      required: [center, monitoringPointLocations, riskZones, evacuationRoutes, notes]
      properties:
        center:
          oneOf:
            - $ref: '#/components/schemas/MapCenter'
            - type: 'null'
        monitoringPointLocations:
          type: array
          uniqueItems: true
          description: monitoringPointId must be unique and belong to this Site and organization.
          x-unique-by: monitoringPointId
          items: { $ref: '#/components/schemas/MonitoringPointMapLocation' }
        riskZones:
          type: array
          uniqueItems: true
          x-unique-by: featureId
          items: { $ref: '#/components/schemas/RiskZoneFeature' }
        evacuationRoutes:
          type: array
          uniqueItems: true
          x-unique-by: featureId
          items: { $ref: '#/components/schemas/EvacuationRouteFeature' }
        notes: { type: [string, 'null'], maxLength: 2000 }
    UpdateSiteMapConfigurationRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SiteMapConfigurationInput'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: [integer, 'null'], minimum: 1 }
    SiteMapConfiguration:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SiteMapConfigurationInput'
        - type: object
          required: [id, siteId, version, createdAt, activatedAt, createdBy]
          properties:
            id: { type: string, minLength: 1 }
            siteId: { type: string, minLength: 1 }
            version: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            activatedAt: { type: string, format: date-time }
            createdBy: { $ref: '#/components/schemas/SafeActorSummary' }
    SiteMapConfigurationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SiteMapConfiguration' }
    SiteMapConfigurationMutationResponse:
      type: object
      additionalProperties: false
      required: [data, changed]
      properties:
        data: { $ref: '#/components/schemas/SiteMapConfiguration' }
        changed: { type: boolean }
    MapOverviewConfiguration:
      type: object
      additionalProperties: false
      required: [configured, version, center, riskZones, evacuationRoutes]
      properties:
        configured: { type: boolean }
        version: { type: [integer, 'null'], minimum: 1 }
        center:
          oneOf:
            - $ref: '#/components/schemas/MapCenter'
            - type: 'null'
        riskZones:
          type: array
          items: { $ref: '#/components/schemas/RiskZoneFeature' }
        evacuationRoutes:
          type: array
          items: { $ref: '#/components/schemas/EvacuationRouteFeature' }
    MapMonitoringPointMarker:
      type: object
      additionalProperties: false
      required: [monitoringPoint, position, currentState]
      properties:
        monitoringPoint: { $ref: '#/components/schemas/MonitoringPointIdentity' }
        position: { $ref: '#/components/schemas/GeoJsonPosition' }
        currentState:
          oneOf:
            - $ref: '#/components/schemas/CurrentMonitoringPointState'
            - type: 'null'
    SopAvailabilitySummary:
      type: object
      additionalProperties: false
      required: [available, documentId, version, title]
      properties:
        available: { type: boolean }
        documentId: { type: [string, 'null'], minLength: 1 }
        version: { type: [integer, 'null'], minimum: 1 }
        title: { type: [string, 'null'], minLength: 1 }
    MapOverview:
      type: object
      additionalProperties: false
      required: [generatedAt, site, configuration, markers, sop]
      properties:
        generatedAt: { type: string, format: date-time }
        site: { $ref: '#/components/schemas/SiteIdentity' }
        configuration: { $ref: '#/components/schemas/MapOverviewConfiguration' }
        markers:
          type: array
          items: { $ref: '#/components/schemas/MapMonitoringPointMarker' }
        sop: { $ref: '#/components/schemas/SopAvailabilitySummary' }
    MapOverviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/MapOverview' }
    UploadSopDocumentRequest:
      type: object
      additionalProperties: false
      required: [file, title]
      properties:
        file: { type: string, format: binary }
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Server trims leading and trailing whitespace before validation and storage.
        description: { type: [string, 'null'], maxLength: 2000 }
    SopDocument:
      type: object
      additionalProperties: false
      required:
        [
          id,
          siteId,
          version,
          title,
          description,
          originalFileName,
          mediaType,
          sizeBytes,
          sha256,
          uploadedBy,
          uploadedAt,
          isActive,
        ]
      description: Public metadata only; private storage keys and object URLs are never exposed.
      properties:
        id: { type: string, minLength: 1 }
        siteId: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        originalFileName:
          { type: string, minLength: 5, maxLength: 255, pattern: '^[^/\\]+[.][pP][dD][fF]$' }
        mediaType: { type: string, const: application/pdf }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        uploadedBy: { $ref: '#/components/schemas/SafeActorSummary' }
        uploadedAt: { type: string, format: date-time }
        isActive: { type: boolean }
    SopDocumentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SopDocument' }
    SopDocumentListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SopDocument' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ReportType:
      type: string
      enum: [SITE_PERIOD_SUMMARY_PDF]
    ReportJobStatus:
      type: string
      enum: [QUEUED, PROCESSING, SUCCEEDED, FAILED, EXPIRED]
    ReportFailureCode:
      type: string
      enum: [REPORT_GENERATION_FAILED, REPORT_ARTIFACT_UNAVAILABLE]
    CreateReportJobRequest:
      type: object
      additionalProperties: false
      required: [reportType, siteId, from, to]
      properties:
        reportType: { $ref: '#/components/schemas/ReportType' }
        siteId: { type: string, minLength: 1 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    ReportArtifactMetadata:
      type: object
      additionalProperties: false
      required: [fileName, mediaType, sizeBytes, sha256, generatedAt, expiresAt]
      description: Safe metadata only; private object keys and URLs are excluded.
      properties:
        fileName:
          { type: string, minLength: 5, maxLength: 255, pattern: '^[^/\\]+[.][pP][dD][fF]$' }
        mediaType: { type: string, const: application/pdf }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        generatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ReportJob:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          site,
          reportType,
          from,
          to,
          status,
          createdBy,
          requestedAt,
          startedAt,
          completedAt,
          expiresAt,
          failureCode,
          failureMessage,
          artifact,
        ]
      properties:
        id: { type: string, minLength: 1 }
        organizationId: { type: string, minLength: 1 }
        site: { $ref: '#/components/schemas/SiteIdentity' }
        reportType: { $ref: '#/components/schemas/ReportType' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ReportJobStatus' }
        createdBy: { $ref: '#/components/schemas/SafeActorSummary' }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        failureCode:
          oneOf:
            - $ref: '#/components/schemas/ReportFailureCode'
            - type: 'null'
        failureMessage:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
          description: Sanitized user-safe message; no stack trace or provider detail.
        artifact:
          oneOf:
            - $ref: '#/components/schemas/ReportArtifactMetadata'
            - type: 'null'
    ReportJobResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReportJob' }
    ReportJobListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReportJob' }
        page: { $ref: '#/components/schemas/PageInfo' }
