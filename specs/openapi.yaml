openapi: 3.1.0
info:
  title: SiagaLongsor API
  version: 0.1.0
  description: Initial API contract for the landslide early-warning monitoring dashboard.
servers:
  - url: /api/v1
paths:
  /iot/telemetry:
    post:
      tags: [IoT]
      summary: Ingest device telemetry
      security:
        - deviceAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryPayload'
      responses:
        '201':
          description: New telemetry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryAccepted'
        '200':
          description: Duplicate telemetry already accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Idempotency or sequence conflict
        '429':
          description: Rate limited
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get dashboard summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
  /monitoring-points:
    get:
      tags: [Monitoring]
      summary: List monitoring points
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: risk
          in: query
          schema:
            $ref: '#/components/schemas/RiskLevel'
      responses:
        '200':
          description: Monitoring point list
  /alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AlertStatus'
      responses:
        '200':
          description: Alert list
  /alerts/{alertId}/acknowledge:
    post:
      tags: [Alerts]
      summary: Acknowledge an alert
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note, fieldCondition, sopExecuted]
              properties:
                note: { type: string, minLength: 3, maxLength: 2000 }
                fieldCondition: { type: string, minLength: 3, maxLength: 2000 }
                sopExecuted: { type: boolean }
      responses:
        '200':
          description: Alert acknowledged
        '409':
          description: Invalid alert transition
  /alerts/{alertId}/resolve:
    post:
      tags: [Alerts]
      summary: Resolve an alert
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note, resolutionCode]
              properties:
                note: { type: string, minLength: 3, maxLength: 2000 }
                resolutionCode: { type: string, minLength: 3, maxLength: 64 }
      responses:
        '200':
          description: Alert resolved
        '409':
          description: Invalid alert transition
  /devices:
    get:
      tags: [Devices]
      summary: List devices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Device list
    post:
      tags: [Devices]
      summary: Register a device
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hardwareId, name, monitoringPointId]
              properties:
                hardwareId: { type: string, minLength: 3, maxLength: 64 }
                name: { type: string, minLength: 3, maxLength: 120 }
                monitoringPointId: { type: string }
      responses:
        '201':
          description: Device created; credential secret is returned once
  /threshold-profiles/{profileId}/activate:
    post:
      tags: [Thresholds]
      summary: Activate threshold profile
      security:
        - bearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Profile activated
        '403':
          description: PROJECT_OWNER required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: DeviceCredential
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    AlertId:
      name: alertId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Action forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    RiskLevel:
      type: string
      enum: [SAFE, WATCH, DANGER, UNKNOWN]
    AlertStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED, RESOLVED, FALSE_ALARM]
    TelemetryPayload:
      type: object
      additionalProperties: false
      required:
        - messageId
        - deviceId
        - sequence
        - timestamp
        - firmwareVersion
        - readings
        - deviceAssessment
      properties:
        messageId: { type: string, minLength: 8, maxLength: 64 }
        deviceId: { type: string, minLength: 3, maxLength: 64 }
        bootId: { type: string, maxLength: 64 }
        sequence: { type: integer, minimum: 0 }
        timestamp: { type: string, format: date-time }
        firmwareVersion: { type: string, maxLength: 32 }
        network:
          type: object
          additionalProperties: false
          properties:
            type: { type: string, enum: [WIFI, CELLULAR, UNKNOWN] }
            signalRssi: { type: number, minimum: -150, maximum: 0 }
        readings:
          type: object
          additionalProperties: false
          required: [tiltMagnitudeDeg, soilMoisturePct, rainfallMmHour, batteryVoltage]
          properties:
            tiltXDeg: { type: number, minimum: -180, maximum: 180 }
            tiltYDeg: { type: number, minimum: -180, maximum: 180 }
            tiltMagnitudeDeg: { type: number, minimum: 0, maximum: 180 }
            soilMoisturePct: { type: number, minimum: 0, maximum: 100 }
            rainfallMmHour: { type: number, minimum: 0, maximum: 1000 }
            batteryVoltage: { type: number, minimum: 0, maximum: 30 }
        deviceAssessment:
          type: object
          additionalProperties: false
          required: [riskLevel, sirenActive]
          properties:
            riskLevel: { $ref: '#/components/schemas/RiskLevel' }
            sirenActive: { type: boolean }
    TelemetryAccepted:
      type: object
      required: [accepted, duplicate, telemetryId, serverRisk, receivedAt]
      properties:
        accepted: { type: boolean, const: true }
        duplicate: { type: boolean }
        telemetryId: { type: string }
        serverRisk: { $ref: '#/components/schemas/RiskLevel' }
        receivedAt: { type: string, format: date-time }
    DashboardSummaryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [monitoringPoints, criticalAlerts, devicesOffline, newAlerts24h, riskDistribution, generatedAt]
          properties:
            monitoringPoints: { type: integer, minimum: 0 }
            criticalAlerts: { type: integer, minimum: 0 }
            devicesOffline: { type: integer, minimum: 0 }
            newAlerts24h: { type: integer, minimum: 0 }
            riskDistribution:
              type: object
              properties:
                safe: { type: integer, minimum: 0 }
                watch: { type: integer, minimum: 0 }
                danger: { type: integer, minimum: 0 }
                unknown: { type: integer, minimum: 0 }
            generatedAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object } }
            requestId: { type: string }
